
name: Deploy AWS Glue Jobs

on:
  push:
    branches: [main]
    paths:
      - "glue/**"
      - ".github/workflows/deploy-glue.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: glue-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      SCRIPTS_BUCKET: ${{ vars.GLUE_SCRIPTS_BUCKET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Python syntax
        run: python -m compileall -q glue/

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Test S3 List Bucket Permissions
        run: |
          aws s3 ls s3://payments-poc-bucket/scripts/
          