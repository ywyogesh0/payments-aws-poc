
name: Deploy AWS Glue Jobs

on:
  push:
    branches: [main]
    paths:
      - "glue/**"
      - ".github/workflows/deploy-glue.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: glue-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      SCRIPTS_BUCKET: ${{ vars.GLUE_SCRIPTS_BUCKET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Python syntax
        run: python -m compileall -q glue/

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Test S3 List Bucket Permissions
        run: |
          aws s3 ls s3://payments-poc-bucket/scripts/

      - name: Upload versioned scripts
        run: |
          RELEASE="${GITHUB_SHA}"

          aws s3 cp glue/bronze_ingestion.py \
            "s3://${SCRIPTS_BUCKET}/scripts/releases/${RELEASE}/bronze_ingestion.py"

          aws s3 cp glue/silver_transformation.py \
            "s3://${SCRIPTS_BUCKET}/scripts/releases/${RELEASE}/silver_transformation.py"

          aws s3 cp glue/gold_aggregation.py \
            "s3://${SCRIPTS_BUCKET}/scripts/releases/${RELEASE}/gold_aggregation.py"

      - name: Update existing Glue jobs
        run: |
          set -euo pipefail

          RELEASE="${GITHUB_SHA}"
          PREFIX="s3://${SCRIPTS_BUCKET}/scripts/releases/${RELEASE}"

          deploy_job() {
            JOB_NAME="$1"
            SCRIPT_NAME="$2"

            SCRIPT_PATH="${PREFIX}/${SCRIPT_NAME}"

            # Confirm the job already exists.
            aws glue get-job \
              --job-name "$JOB_NAME" >/dev/null

            # Update only the command definition.
            # Other job settings remain unchanged.
            JOB_UPDATE=$(jq -n \
              --arg script "$SCRIPT_PATH" \
              '{
                Command: {
                  Name: "glueetl",
                  ScriptLocation: $script
                }
              }')

            aws glue update-job \
              --job-name "$JOB_NAME" \
              --job-update "$JOB_UPDATE"

            echo "Deployed: $JOB_NAME"
          }

          deploy_job \
            "payments-s3-to-bronze" \
            "bronze_ingestion.py"

          deploy_job \
            "payments-bronze-to-silver" \
            "silver_transformation.py"

          deploy_job \
            "payments-silver-to-gold" \
            "gold_aggregation.py"

      - name: Verify deployed scripts
        run: |
          set -euo pipefail

          RELEASE="${GITHUB_SHA}"
          PREFIX="s3://${SCRIPTS_BUCKET}/scripts/releases/${RELEASE}"

          verify_job() {
            ACTUAL=$(aws glue get-job \
              --job-name "$1" \
              --query 'Job.Command.ScriptLocation' \
              --output text)

            EXPECTED="${PREFIX}/$2"

            test "$ACTUAL" = "$EXPECTED"
            echo "Verified: $1"
          }

          verify_job payments-s3-to-bronze bronze_ingestion.py
          verify_job payments-bronze-to-silver silver_transformation.py
          verify_job payments-silver-to-gold gold_aggregation.py
